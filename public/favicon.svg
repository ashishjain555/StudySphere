<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Electric Indigo & Violet -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Academic Cap Gradient: Brilliant Pure White to Ice Blue -->
    <linearGradient id="capGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <!-- AI Sparkle & Orbital Ring Gradient: Cyan to Golden Amber -->
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Subtle Inner Shadow & Glow -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Modern App Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.3)" stroke-width="1.5" />

  <!-- StudySphere Planetary Orbital Glow Arc -->
  <path d="M 11 44 C 13 52, 51 52, 53 44" stroke="url(#sparkGrad)" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  <ellipse cx="32" cy="48" rx="3.5" ry="1.5" fill="#38BDF8" opacity="0.6" filter="url(#softGlow)" />

  <!-- Graduation Cap Lower Skullcap -->
  <path d="M 21 28.5 V 36 C 21 42, 43 42, 43 36 V 28.5" fill="#1E1B4B" fill-opacity="0.45" />
  <path d="M 21 28.5 V 36 C 21 42, 43 42, 43 36 V 28.5" stroke="url(#capGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Graduation Cap Mortarboard Diamond -->
  <path d="M 32 16 L 51 25.5 L 32 35 L 13 25.5 Z" fill="url(#capGrad)" filter="url(#softGlow)" />
  <path d="M 32 18 L 47 25.5 L 32 33 L 17 25.5 Z" fill="#EEF2FF" />

  <!-- Tassel Cord & Golden Pendant -->
  <path d="M 43 27 C 46 30, 47 34, 46 38" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" />
  <circle cx="46" cy="39" r="2" fill="url(#goldGrad)" />
  <circle cx="32" cy="25.5" r="1.5" fill="#4F46E5" />

  <!-- AI Intelligence Star / Sparkle (Top-Right) -->
  <path d="M 49 10 L 50.2 13.8 L 54 15 L 50.2 16.2 L 49 20 L 47.8 16.2 L 44 15 L 47.8 13.8 Z" fill="url(#sparkGrad)" />
</svg>
